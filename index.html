<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Swirling Jet Visualization</title>
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="viewer"></div>
  <header id="topbar">
    <button id="menu-button" aria-label="Open menu" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
    <div id="title-area">
      <div id="title">Scale-decomposed vortex structures</div>
      <div id="condition-label">No swirl</div>
    </div>
  </header>
  <div id="backdrop"></div>
  <nav id="drawer">
    <div class="drawer-title">Flow condition</div>
    <button class="case-button active" data-case="c000">No swirl<span>C = 0.00</span></button>
    <button class="case-button" data-case="c025">Weak swirl<span>C = 0.25</span></button>
    <button class="case-button" data-case="c050">Strong swirl<span>C = 0.50</span></button>
    <div class="drawer-note">Drag with one finger to rotate.<br>Pinch to zoom.<br>Drag with two fingers to pan.</div>
  </nav>
  <div id="legend">
    <div class="legend-row"><span class="swatch b1"></span><span>b1</span><span class="lambda">λ₂ = −0.005</span></div>
    <div class="legend-row"><span class="swatch b3"></span><span>b3</span><span class="lambda">λ₂ = −0.1</span></div>
    <div class="legend-row"><span class="swatch b5"></span><span>b5</span><span class="lambda">λ₂ = −1</span></div>
  </div>
  <button id="reset-view">Reset view</button>
  <div id="loading"><div class="spinner"></div><div id="loading-text">Loading...</div></div>
  <script type="module" src="./app.js"></script>
</body>
</html>
